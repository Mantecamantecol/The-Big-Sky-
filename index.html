function nombre(){
return nombreHilbert.trim()||"Hilbert";
}

function esc(s){
return s.replace(/[&<>"']/g,x=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[x]));
}

function clase(s){
let n=nombre();

if(s.startsWith("IC:")||s.startsWith(n+":"))return"dialogoIC";
if(s.startsWith("HS:"))return"dialogoHS";
if(s.startsWith("WP:"))return"dialogoWP";
if(s.startsWith("FV:"))return"dialogoFV";

return"";
}

function mostrarTexto(t){
t=t.replace(/\{NOMBRE\}/g,nombre());

return t.split("|||").map(b=>b.split("\n").map(x=>
x.trim()?`<div class="linea ${clase(x)}">${esc(x)}</div>`:""
).join("")).join("");
}

function guardar(){
localStorage.setItem("TheBigSKY_Save",JSON.stringify({
pagina,
nombreHilbert
}));
}
try{
let s=JSON.parse(localStorage.getItem("TheBigSKY_Save"));

if(s&&typeof s.pagina==="number"&&s.pagina>=1&&s.pagina<=TOTAL)
pagina=s.pagina;

if(s&&typeof s.nombreHilbert==="string")
nombreHilbert=s.nombreHilbert;

}catch(e){}

}

function actualizarBarra(){

if(tipoClash==="papa"){
actual=pacienciaPapa;
maximo=100;
}else{
actual=hpSkybound;

}

barraUnica.style.width=Math.max(0,actual/maximo*100)+"%";
hp.textContent=actual+"/"+maximo;
}

function actualizarTres(){
barraSky1.style.width=Math.max(0,hpSkybounds[0]/75*100)+"%";
barraSky2.style.width=Math.max(0,hpSkybounds[1]/75*100)+"%";
barraSky3.style.width=Math.max(0,hpSkybounds[2]/75*100)+"%";

hpTres.textContent="HP de Hilbert: "+hpHilbert+"/110";
}

function actualizarFallen(){

barraHilbertFallen.style.width=
Math.max(0,hpHilbertFallen/110*100)+"%";

barraSamanthaFallen.style.width=
Math.max(0,hpSamanthaFallen/100*100)+"%";

hpFallenTexto.textContent=hpFallen+"/850";
hpHilbertFallenTexto.textContent=hpHilbertFallen+"/110";
hpSamanthaFallenTexto.textContent=hpSamanthaFallen+"/100";

function atacar(){
if(terminado||turnoOcupado)return;

if(tipoClash==="papa"){
pacienciaPapa=Math.max(0,pacienciaPapa-20);

actualizarBarra();
gif("escenaG");

texto.innerHTML=
`<div class="linea dialogoIC">${esc(nombre())}: TOMA!</div>`;

if(pacienciaPapa<=0){
papaSeVa();
}

return;
}

if(tipoClash==="sky"){
turnoOcupado=true;

hpSkybound=Math.max(0,hpSkybound-20);

actualizarBarra();
gif("escenaGS");

texto.innerHTML=
`<div class="linea dialogoIC">${esc(nombre())}: TOMA!</div>`;

if(hpSkybound<=0){
skyDerrotado();
return;
}

setTimeout(ataqueSky,500);
return;
}

if(tipoClash==="tres"){
turnoOcupado=true;

let vivos=[];

for(let i=0;i<3;i++){
if(hpSkybounds[i]>0){
vivos.push(i);
}
}

if(!vivos.length){
turnoOcupado=false;
return;
}

let objetivo=vivos[turnoSky%vivos.length];

hpSkybounds[objetivo]=
Math.max(0,hpSkybounds[objetivo]-30);

turnoSky++;

actualizarTres();
gif("escenaGS");

texto.innerHTML=
`<div class="linea dialogoIC">${esc(nombre())}: TOMA!</div>`;

if(hpSkybounds.every(x=>x<=0)){
tresDerrotados();
return;
}

setTimeout(ataqueTres,500);
return;
}

if(tipoClash==="fallen"){
atacarFallen();
}
}

function ataqueSky(){
if(terminado||tipoClash!=="sky"){
turnoOcupado=false;
return;
}

let d=Math.random()<0.5?25:30;

hpHilbert=Math.max(0,hpHilbert-d);

gif("escenaNS");

texto.innerHTML=
`<div class="linea">El Skybound ataca y hace ${d} de daño!<br>HP de Hilbert: ${hpHilbert}/85</div>`;

actualizarBarra();

if(hpHilbert<=0){
derrota();
return;
}

turnoOcupado=false;
}

function ataqueTres(){
if(terminado||tipoClash!=="tres"){
turnoOcupado=false;
return;
}

let vivos=[];

for(let i=0;i<3;i++){
if(hpSkybounds[i]>0){
vivos.push(i);
}
}

if(!vivos.length){
turnoOcupado=false;
return;
}

let atacante=
vivos[Math.floor(Math.random()*vivos.length)];

/* LOS 3 SKYBOUNDS HACEN ENTRE 10 Y 15 DE DAÑO */
let d=10+Math.floor(Math.random()*6);

hpHilbert=Math.max(0,hpHilbert-d);

gif("escenaNS");
actualizarTres();

texto.innerHTML=
`<div class="linea">Skybound ${atacante+1} ataca y hace ${d} de daño!<br>HP de Hilbert: ${hpHilbert}/110</div>`;

if(hpHilbert<=0){
derrota();
return;
}

turnoOcupado=false;
}

function dañoSamantha(){
const daños=[30,35,40];

return daños[Math.floor(Math.random()*daños.length)];
}

function dañoHilbert(){
if(Math.random()<0.15){
return 45;
}

return 30;
}

function atacarFallen(){
if(terminado||turnoOcupado)return;

turnoOcupado=true;

let dañoH=0;
let dañoS=0;

if(hpHilbertFallen>0){
dañoH=dañoHilbert();
hpFallen=Math.max(0,hpFallen-dañoH);
}

if(hpSamanthaFallen>0){
dañoS=dañoSamantha();
hpFallen=Math.max(0,hpFallen-dañoS);
}

actualizarFallen();
gif("escenaGF");

texto.innerHTML=
`<div class="linea dialogoIC">${esc(nombre())}: TOMA! (${dañoH} daño)</div>
<div class="linea dialogoHS">Samantha: TOMA! (${dañoS} daño)</div>`;

if(hpFallen<=0){
fallenDerrotado();
return;
}

setTimeout(ataqueFallen,500);
}

function ataqueFallen(){
if(terminado||tipoClash!=="fallen"){
turnoOcupado=false;
return;
}

let vivos=[];

if(hpHilbertFallen>0){
vivos.push("Hilbert");
}

if(hpSamanthaFallen>0){
vivos.push("Samantha");
}

if(!vivos.length){
derrotaFallen();
return;
}

if(Math.random()<0.30){
gif("escenaNF");

texto.innerHTML=
`<div class="linea">¡FALLEN FALLÓ SU ATAQUE!</div>`;

actualizarFallen();

turnoOcupado=false;
return;
}

let objetivo=
vivos[Math.floor(Math.random()*vivos.length)];

if(objetivo==="Hilbert"){
hpHilbertFallen=
Math.max(0,hpHilbertFallen-50);
}else{
hpSamanthaFallen=
Math.max(0,hpSamanthaFallen-50);
}

actualizarFallen();
gif("escenaNF");

texto.innerHTML=
`<div class="linea">Fallen ataca a ${objetivo} y hace 50 de daño!</div>`;

if(hpHilbertFallen<=0&&hpSamanthaFallen<=0){
derrotaFallen();
return;
}

turnoOcupado=false;
}

}

function derrota(){
if(terminado)return;

terminado=true;
turnoOcupado=false;

gif("escenaSG");

acciones.style.display="none";

texto.innerHTML=
"<div class='linea'>¡Hilbert fue derrotado!</div>";

musicaOff();

vida.style.display="none";
}

function terminarClash(){
terminado=true;
turnoOcupado=false;

acciones.style.display="none";
vida.style.display="none";

musicaOff();

tipoClash=null;
}

function mostrarNombre(){
nombreBox.style.display="block";
}

function confirmarNombre(){
let n=nombreInput.value.trim();

if(n)nombreHilbert=n;

nombreBox.style.display="none";

actualizar();
}

function iniciarTBS(){
if(!startDisponible||pagina!==31)return;

pagina=32;
startDisponible=false;

startButton.style.display="none";

actualizar();
}

function irAnterior(){
if(pagina<=1)return;

if(timerStart)clearTimeout(timerStart);

startDisponible=false;

pagina--;

actualizar();
}

function irSiguiente(){
if(pagina>=TOTAL||pagina===31)return;

pagina++;

actualizar();
}

function preparar31(){
startDisponible=false;

botonAnterior.style.display="inline-block";
botonSiguiente.style.display="none";
startButton.style.display="none";

if(timerStart)clearTimeout(timerStart);

timerStart=setTimeout(()=>{
if(pagina===31){
startDisponible=true;
startButton.style.display="inline-block";
}
},10000);
}

function actualizar(){

if(timerStart){
clearTimeout(timerStart);
timerStart=null;
}

startDisponible=false;
turnoOcupado=false;

acciones.style.display="none";
vida.style.display="none";

botonHuir.disabled=false;
botonHablar.disabled=false;
botonAtacar.disabled=false;

noMercy.style.display="none";

musicaOff();

tipoClash=null;
terminado=true;

document.body.style.background=
pagina<=5?"#000":"#F4FBFF";

document.body.style.color=
pagina<=5?"#fff":"#152B3A";

let n=String(pagina).padStart(3,"0");

if(pagina===5){

contenido.innerHTML=
'<video controls autoplay playsinline><source src="pelea.mp4" type="video/mp4"></video>';

}
else if(pagina===71){

contenido.innerHTML=
'<video controls autoplay playsinline><source src="hilbertSHIT.mp4" type="video/mp4"></video>';

}

else if(pagina===22){

contenido.innerHTML=
'<video controls autoplay playsinline><source src="TBS.mp4" type="video/mp4"></video>';

}
else if(pagina===31){

contenido.innerHTML=
'<video controls autoplay playsinline><source src="loadingTBS.mp4" type="video/mp4"></video>';

}
else if(pagina===58){

contenido.innerHTML=
'<video controls autoplay playsinline><source src="Fallenwin.mp4" type="video/mp4"></video>';

}
else{

contenido.innerHTML=
`<img src="${n}.png" alt="Página ${pagina}">`;

}

if(pagina===28){

texto.innerHTML="";
iniciarPapa();

}
else if(pagina===37){

texto.innerHTML="";
iniciarSky();

}
else if(pagina===50){

texto.innerHTML="";
iniciarTres();

}
else if(pagina===57){

texto.innerHTML="";
iniciarFallen();

}
else{

texto.innerHTML=
mostrarTexto(textos[pagina-1]||"");

}

nombreBoton.style.display=
pagina===6?"inline-block":"none";

botonAnterior.style.display=
pagina>1?"inline-block":"none";

botonSiguiente.style.display=
pagina<TOTAL&&pagina!==31?"inline-block":"none";

startButton.style.display="none";

if(pagina===31){
preparar31();
}

guardar();
}

actualizar();

</script>
</body>
</html>
